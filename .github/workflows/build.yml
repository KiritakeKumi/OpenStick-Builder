name: Build

on:
  workflow_dispatch:
    inputs:
      host_arch:
        description: 'Build host: x86_64 bootstraps the rootfs through qemu-user, arm64 runs it natively'
        type: choice
        default: x86_64
        options:
          - x86_64
          - arm64
          - both

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(inputs.host_arch == 'both' && '["x86_64","arm64"]' || format('["{0}"]', inputs.host_arch)) }}

    runs-on: ${{ matrix.host == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: sudo sh -e scripts/install_deps.sh

      - name: Build hyp and aboot firmware
        run: sudo sh -e scripts/build_hyp_aboot.sh

      - name: Extract MSM8916 firmware
        run: sudo sh -e scripts/extract_fw.sh

      # runner.os is "Linux" on both hosts, so the cache key needs matrix.host
      # to keep the two build hosts from evicting each other's entries.
      # restore-keys matters as much as the key here: the pinned tarball is a
      # ~200 MB codeload.github.com download that gets rate-limited (HTTP 429),
      # and without a prefix fallback every edit to build_kernel.sh or to a
      # patch forces a cold re-download.
      - name: Restore pinned Linux source cache
        uses: actions/cache@v4
        with:
          path: .cache/kernel-6.6-wcn36xx
          key: ${{ runner.os }}-${{ matrix.host }}-msm8916-linux-6.6-${{ hashFiles('scripts/build_kernel.sh', 'patches/linux/*.patch') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.host }}-msm8916-linux-6.6-

      - name: Build Linux 6.6 with wcn36xx fix
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sudo --preserve-env=GITHUB_ACTIONS,GITHUB_TOKEN sh -e scripts/build_kernel.sh

      - name: Upload kernel diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: linux-6.6-wcn36xx-build-${{ matrix.host }}
          path: |
            kernel-out/boot/vmlinuz
            kernel-out/lib/modules/6.6.0-msm8916/kernel/drivers/net/wireless/ath/wcn36xx/wcn36xx.ko
            kernel-out/usr/share/openstick-kernel/build-info.txt
            kernel-out/usr/share/openstick-kernel/patches.sha256
            kernel-out/usr/share/openstick-kernel/SHA256SUMS

      - name: Restore debootstrap package cache
        uses: actions/cache@v4
        with:
          path: .cache/debootstrap
          key: ${{ runner.os }}-${{ matrix.host }}-debootstrap-trixie-arm64-${{ hashFiles('scripts/debootstrap.sh') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.host }}-debootstrap-trixie-arm64-

      - name: Create rootfs
        run: sudo sh -e scripts/debootstrap.sh

      - name: Upload debootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debootstrap-diagnostics-${{ matrix.host }}
          path: |
            build-logs/debootstrap.log
            rootfs/debootstrap/debootstrap.log
          if-no-files-found: ignore

      - name: Build gadget-tool
        run: sudo sh -e scripts/build_gt.sh

      - name: Create images
        run: sudo sh -e scripts/build_images.sh

      - name: Generate image checksums
        run: cd files && sha256sum * > SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openstick-debian-${{ matrix.host }}
          path: files/*
